<script>
// let visibleCount = 3;
let currentFilter = 'all';


// ============================
// 📅 DATE PARSER
// ============================
// ============================
// 📅 ROBUST EVENT DATE PARSER
// ============================
function getEventDate(e) {
  if (!e || !e.dates || typeof e.dates !== 'string') {
    return new Date(0);
  }

  const dateStr = e.dates.trim();

  const months = {
    january: 0,
    february: 1,
    march: 2,
    april: 3,
    may: 4,
    june: 5,
    july: 6,
    august: 7,
    september: 8,
    october: 9,
    november: 10,
    december: 11
  };

  // Supports:
  // 24–26 September 2026
  // 9, 10 & 12 October 2026
  // 23 October 2026 – 21 January 2027
  // 10 September 2026
  const match = dateStr.match(
    /\b(\d{1,2})(?:\s*[-–—]\s*\d{1,2})?(?:,\s*\d{1,2})*(?:\s*&\s*\d{1,2})?\s+([A-Za-z]+)\s+(20\d{2})\b/i
  );

  if (match) {
    const day = parseInt(match[1], 10);
    const monthName = match[2].toLowerCase();
    const year = parseInt(match[3], 10);

    if (months[monthName] !== undefined) {
      return new Date(year, months[monthName], day);
    }
  }

  return new Date(0);
}


// ============================
// 🔥 EVENT STATUS
// ============================
function getStatus(e) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const eventDate = getEventDate(e);
  eventDate.setHours(0, 0, 0, 0);

  return eventDate >= today ? 'upcoming' : 'past';
}

// ============================
// 🔥 AUTO STATUS (FIXES BUG)
// ============================
function getStatus(e) {
  const today = new Date();
  const eventDate = getEventDate(e);

  today.setHours(0,0,0,0);
  eventDate.setHours(0,0,0,0);

  return eventDate > today ? 'upcoming' : 'past';
}

// ============================
// 🎯 MAIN RENDER
// ============================
function renderEvents(filter = 'all') {
  const grid = document.getElementById('eventsGrid');
  if (!grid || !window.EVENTS) return;

  const filtered = EVENTS

    // ✅ FILTER LOGIC
    .filter(e => {
      if (filter === 'all') return true;
      if (filter === 'upcoming') return getStatus(e) === 'upcoming';
      return e.type === filter;
    })

    // ✅ SORT LOGIC (CORRECT ORDER)
    .sort((a, b) => {
      const statusA = getStatus(a);
      const statusB = getStatus(b);

      // Upcoming first
      if (statusA === 'upcoming' && statusB !== 'upcoming') return -1;
      if (statusA !== 'upcoming' && statusB === 'upcoming') return 1;

      // Then by latest date
      return getEventDate(b) - getEventDate(a);
    });


  if (!filtered.length) {
    grid.innerHTML = `
      <div style="padding:60px;text-align:center">
        <h3>No events found</h3>
        <p>Try another filter</p>
      </div>`;
    return;
  }

  // const visibleEvents = filtered.slice(0, visibleCount);

  grid.innerHTML = filtered.map(e => `
    <div class="event-card card-hover">

   <a href="event-detail.html?id=${e.id}" class="event-image-link">
  <div class="event-image" style="
    ${e.image 
      ? `background-image:url('${e.image}');background-size:cover;background-position:center;`
      : `background:${e.heroGradient};display:flex;align-items:center;justify-content:center;font-size:40px;`
    }
  ">
    ${e.image ? '<div class="event-overlay"></div>' : ''}
    ${!e.image ? (e.heroEmoji || '🎨') : ''}
  </div>
</a>

      <div class="event-content">

        <!-- ✅ FIXED TAG -->
      <span class="event-tag ${e.tagClass || ''}">
  ${getStatus(e) === 'upcoming'
    ? (e.tagLabel || 'Upcoming Event')
    : 'Events & Highlights'}
</span>

        <h3 class="event-title">${e.title}</h3>

        <div class="event-meta">
          <span>📅 ${e.dates}</span>
          <span>📍 ${(e.city || '').split(',')[0]}</span>
        </div>

        <p class="event-desc">${e.subtitle || ''}</p>

        <a href="event-detail.html?id=${e.id}" class="event-link">
          Learn more →
        </a>

      </div>
    </div>
  `).join('');
}


// ============================
// 🎛 FILTER BUTTON
// ============================
function filterEvents(btn, cat) {
  currentFilter = cat;
   

  document.querySelectorAll('.filter-btn')
    .forEach(b => b.classList.remove('active'));

  btn.classList.add('active');

  renderEvents(cat);
}


// ============================
// ➕ LOAD MORE
// ============================
// function loadMoreEvents() {
//   visibleCount += 3;
//   renderEvents(currentFilter);
// }


// INIT
// INIT — wait for loader.js to finish loading events.js
window.addEventListener('site-scripts-ready', function () {
  renderEvents();
});

</script>
