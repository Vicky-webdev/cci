<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Press & Media - Crafts Council of India</title>

<link rel="stylesheet" href="cci.css">

<!-- Favicon -->
<link rel="icon" type="image/png" href="images/favico.png" sizes="32x32">
<link rel="icon" type="image/png" href="images/favico.png" sizes="16x16">
<link rel="apple-touch-icon" href="images/favico.png">

<meta name="theme-color" content="#8B3A1E">

<style>

.event-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.45),transparent);
}

.event-image{
  position:relative;
}

.press-image{
  aspect-ratio:4/5;
  border-radius:18px 18px 0 0;
  overflow:hidden;
  position:relative;
}

.press-image::after{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.4),transparent);
}

.event-card{
  overflow:hidden;
}

.event-tag{
  background:#f4eee7;
  color:#8B3A1E;
}

.event-meta{
  margin-top:10px;
}

</style>
</head>

<body>

<nav id="main-nav"></nav>
<div id="mobileMenu" class="mobile-menu"></div>

<!-- HERO -->
<div class="page-hero">
  <div class="page-hero-content">

    <h1 class="page-title">
      Press & Media
    </h1>

    <p class="page-subtitle">
      Press releases, newspaper coverage, media highlights, and stories celebrating India's craft traditions.
    </p>

  </div>
</div>

<!-- SECTION -->
<div class="section">

  <!-- FILTERS -->
<!-- YEAR FILTERS -->
    <div class="filters">

      <button class="filter-btn active year-filter"
        onclick="filterYear(this,'all')">

        All

      </button>

      <button class="filter-btn year-filter"
        onclick="filterYear(this,'2026')">

        2026

      </button>

      <button class="filter-btn year-filter"
        onclick="filterYear(this,'2025')">

        2025

      </button>

      <button class="filter-btn year-filter"
        onclick="filterYear(this,'1980-1990')">

        1980 - 1990

      </button>

    </div>

  <!-- GRID -->
  <div class="events-grid" id="pressGrid"></div>

</div>




<!-- NAV -->
<script src="config.js"></script>
<script src="loader.js?v=2"></script>

<!-- PRESS DATA -->
 

<script>

let currentYear = 'all';


// ============================================
// CARD COVER IMAGE
// ============================================
// Uses the item's `image`. Clippings are anchored to the top so the
// headline shows; PDF covers (e.g. the 1980–1990 archive) can't be shown
// as a background, so they fall back to the gradient with an icon.

function pressCover(p){

  const isImage = p.image && !/\.pdf$/i.test(p.image);

  if(isImage){
    return `
      <div class="event-image" style="
        background-image:url('${encodeURI(p.image)}');
        background-size:cover;
        background-position:center top;
      ">
        <div class="event-overlay"></div>
      </div>`;
  }

  return `
    <div class="event-image" style="background:${p.heroGradient || 'linear-gradient(160deg,#5B7053,#2E2418)'}">
      📰
    </div>`;

}


// ============================================
// RENDER PRESS
// ============================================

function renderPress(){

  const grid =
    document.getElementById('pressGrid');

  if(!grid || !window.PRESS) return;

const filtered = PRESS

.filter(p => {

  // ALL
  if(currentYear==='all'){
    return true;
  }

  // 1980–1990 range
  if(currentYear==='1980-1990'){

    return (
      parseInt(p.year)>=1980 &&
      parseInt(p.year)<=1990
    );

  }

  return p.year===currentYear;

})

.sort((a,b)=>{

  /* newest year first */
  return parseInt(b.year)-parseInt(a.year);

});

  // EMPTY
  if(!filtered.length){

    grid.innerHTML = `
      <div style="
        padding:80px 20px;
        text-align:center;
        width:100%;
      ">
        <h3>No press coverage found</h3>
      </div>
    `;

    return;
  }

  // GRID
 grid.innerHTML = filtered.map(p => `

<div class="event-card card-hover">

    <a href="press-details.html?id=${p.id}"
       class="event-image-link">

        ${pressCover(p)}

    </a>

    <div class="event-content">

        <div class="event-meta">

            <span class="event-tag">
                ${p.year}
            </span>

        </div>

        <h3 class="event-title">
            ${p.title}
        </h3>

        <p class="event-desc">
            ${p.subtitle || ''}
        </p>

        <a href="press-details.html?id=${p.id}"
           class="event-link">

           Read Coverage →

        </a>

    </div>

</div>

`).join('');

}


// ============================================
// YEAR FILTER
// ============================================

function filterYear(btn, year){

  currentYear = year;

  document.querySelectorAll('.year-filter')
    .forEach(b => b.classList.remove('active'));

  btn.classList.add('active');

  renderPress();

}


// ============================================
// INIT
// ============================================

window.addEventListener('site-scripts-ready', function () {
    renderPress();
});

</script>
 

</body>
</html>
