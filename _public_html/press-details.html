<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Press Details - Crafts Council of India</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="cci.css">

<style>

/* ─────────────────────────
   HERO
───────────────────────── */

.ed-hero{
  position:relative;
  min-height:480px;
  display:flex;
  align-items:flex-end;
  overflow:hidden;
}

.ed-hero-bg{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  transition:transform 8s ease;
}

.ed-hero:hover .ed-hero-bg{
  transform:scale(1.03);
}

.ed-hero-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(
    to top,
    rgba(20,10,6,.88) 0%,
    rgba(20,10,6,.45) 60%,
    rgba(20,10,6,.15) 100%
  );
}

.ed-hero-content{
  position:relative;
  z-index:2;
  padding:56px 48px;
  width:100%;
  max-width:900px;
}

.ed-breadcrumb{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:12px;
  color:rgba(250,246,239,.65);
  margin-bottom:20px;
  flex-wrap:wrap;
}

.ed-breadcrumb a{
  color:rgba(250,246,239,.65);
  text-decoration:none;
}

.ed-tag{
  display:inline-block;
  padding:5px 12px;
  background:var(--cr);
  color:#FAF6EF;
  border-radius:2px;
  font-size:11px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  margin-bottom:18px;
}

.ed-title{
  font-family:'Cormorant Garamond',serif;
  font-size:58px;
  line-height:1.05;
  color:#FAF6EF;
  margin-bottom:18px;
  font-weight:500;
}

.ed-meta-row{
  display:flex;
  gap:24px;
  flex-wrap:wrap;
}

.ed-meta-item{
  font-size:14px;
  color:rgba(250,246,239,.82);
  font-weight:300;
}

/* ─────────────────────────
   BODY
───────────────────────── */

.ed-body{
  display:block;
  max-width:1200px;
  margin:0 auto;
  padding:0 48px;
}

.ed-main{
  width:100%;
  padding:56px 0;
  border:none;
}

.ed-section-label{
  font-size:10px;
  font-weight:500;
  letter-spacing:2.5px;
  text-transform:uppercase;
  color:var(--cr);
  margin-bottom:16px;
  display:block;
}

.ed-divider{
  width:48px;
  height:2px;
  background:var(--cr);
  margin-bottom:28px;
}

.ed-description p{
  font-size:16px;
  line-height:1.9;
  color:var(--bark);
  font-weight:300;
  margin-bottom:20px;
}

/* ─────────────────────────
   MEDIA BLOCK
───────────────────────── */

.press-media-block{
  margin-top:72px;
}

.press-media-title{
  font-family:'Cormorant Garamond',serif;
  font-size:34px;
  font-weight:500;
  color:var(--ink);
  margin-bottom:24px;
}

.press-media-title::after{
  content:'';
  display:block;
  width:48px;
  height:2px;
  background:var(--cr);
  margin-top:10px;
}

/* ─────────────────────────
   GALLERY
───────────────────────── */

.ed-gallery{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

.ed-gallery-item{
  aspect-ratio:4/5;
  overflow:hidden;
  border-radius:8px;
  border:1px solid var(--border);
  background:#f4eee7;
  cursor:pointer;
}

.ed-gallery-item img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:transform .25s ease;
}

.ed-gallery-item:hover img{
  transform:scale(1.03);
}

/* ─────────────────────────
   LIGHTBOX
───────────────────────── */

.lightbox{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.95);

  display:flex;
  align-items:center;
  justify-content:center;

  opacity:0;
  visibility:hidden;

  transition:opacity .25s ease;

  z-index:999999;
}

.lightbox.active{
  opacity:1;
  visibility:visible;
}

.lightbox img{
  max-width:92%;
  max-height:88vh;
  object-fit:contain;
}

.lightbox-close{
  position:absolute;
  top:22px;
  right:22px;

  width:42px;
  height:42px;

  border:none;
  border-radius:50%;

  background:rgba(255,255,255,.1);

  color:#fff;
  font-size:20px;

  cursor:pointer;
}

.lightbox-nav{
  position:absolute;
  top:50%;
  transform:translateY(-50%);

  width:54px;
  height:54px;

  border:none;
  border-radius:50%;

  background:rgba(255,255,255,.1);

  color:#fff;
  font-size:34px;

  cursor:pointer;
}

.lightbox-nav.prev{
  left:24px;
}

.lightbox-nav.next{
  right:24px;
}



/* ── PRESS META ───────────────── */

.press-meta-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;

    margin:8px 0 24px;
    flex-wrap:wrap;
}

.press-date{
    font-size:13px;
    color:var(--mud);
    font-weight:400;

    display:flex;
    align-items:center;
    gap:6px;
}

/* ── READ ONLINE BUTTON ───────────────── */

.read-online-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;

    padding:8px 16px;

    border:1px solid var(--border);
    border-radius:24px;

    background:#fff;
    color:var(--cr);

    text-decoration:none;
    font-size:13px;
    font-weight:500;

    transition:
      background .25s ease,
      color .25s ease,
      transform .25s ease;
}

.read-online-btn:hover{
    background:var(--cr);
    color:#FAF6EF;
    transform:translateY(-2px);
}

@media(max-width:768px){

   .press-meta-row{
      align-items:flex-start;
      flex-direction:column;
   }

}

/* ─────────────────────────
   RESPONSIVE
───────────────────────── */

@media(max-width:960px){

  .ed-title{
    font-size:44px;
  }

  .ed-gallery{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:640px){

  .ed-hero{
    min-height:360px;
  }

  .ed-hero-content{
    padding:40px 20px;
  }

  .ed-body{
    padding:0 20px;
  }

  .ed-title{
    font-size:34px;
  }

  .ed-gallery{
    grid-template-columns:1fr;
  }

}

</style>
</head>

<body>

<nav id="main-nav"></nav>

<div id="mobileMenu" class="mobile-menu"></div>

<!-- PAGE RENDER -->
<div id="eventPage"></div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">

  <button class="lightbox-close"
    id="lightboxClose">
    ✕
  </button>

  <button class="lightbox-nav prev"
    id="lightboxPrev">
    ‹
  </button>

  <img id="lightboxImg" src="" alt="">

  <button class="lightbox-nav next"
    id="lightboxNext">
    ›
  </button>

</div>


 
<div id="site-footer"></div>
<script src="config.js"></script>
<script src="loader.js?v=2"></script>
<!-- Press detail rendering + lightbox are handled by press.js (loaded via loader.js) -->

</body>
</html>
